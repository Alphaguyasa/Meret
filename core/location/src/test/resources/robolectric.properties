# The android-all jar available to this project is the SDK 34 build. Pinning it here
# rather than on every test class keeps the choice in one place, and keeps the suite
# runnable with no network.
#
# 34 is also above the API 30 floor for GnssStatus.Builder, which GnssStatusReductionTest
# needs to construct a GnssStatus at all.
sdk=34

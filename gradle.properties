# Build settings shared by every module. SDK levels live in build-logic (KotlinAndroid.kt),
# versions in gradle/libs.versions.toml; nothing machine-specific belongs here
# (local.properties holds sdk.dir and the Supabase keys, and is gitignored).

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# AGP 9 has built-in Kotlin support and, by default, rejects plugins that register
# Kotlin source sets directly. KSP still does that to contribute its generated sources,
# so the check has to be relaxed until KSP moves to the android.sourceSets DSL.
android.disallowKotlinSourceSets=false

# Non-transitive R classes keep each module's R to its own resources. With ~20 modules
# this is a large build-speed and correctness win.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
